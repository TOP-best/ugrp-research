<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2026 UGRP — WorldBest Lab</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=JetBrains+Mono:wght@400;500;700&family=Inter:ital,wght@0,300;0,400;0,600;0,700;0,800;0,900;1,700;1,800;1,900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.31.0/dist/tabler-icons.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ===== LOGIN ===== -->
<div id="loginPage" class="page active">
  <canvas id="bgCanvas"></canvas>
  <div class="login-center">
    <div class="login-quote">
      <blockquote>"The essence of mathematics lies in freedom"</blockquote>
    </div>
    <div class="login-hero">
      <div class="hero-logo"><img src="logo.png" alt="WB"></div>
      <div class="hero-text">
        <h1>2026 UGRP</h1>
        <p>WorldBest Lab</p>
      </div>
      <button class="login-btn" id="loginBtn">LOG IN</button>
    </div>
  </div>
</div>

<!-- ===== MEMBER OVERLAY ===== -->
<div class="member-overlay" id="memberOverlay" style="display:none">
  <div class="member-panel">
    <div class="mp-header">
      <span class="mp-title">연구원 선택</span>
      <button class="mp-close" id="mpClose"><i class="ti ti-x"></i></button>
    </div>
    <div class="mp-members" id="mpMembers">
      <button class="mp-member" data-idx="0">
        <div class="mp-av av0" id="mpAv0">김</div>
        <div class="mp-info"><span class="mp-name" id="mpName0">김민준</span><span class="mp-role">Researcher A</span></div>
        <i class="ti ti-chevron-right mp-chevron"></i>
      </button>
      <button class="mp-member" data-idx="1">
        <div class="mp-av av1" id="mpAv1">이</div>
        <div class="mp-info"><span class="mp-name" id="mpName1">이서연</span><span class="mp-role">Researcher B</span></div>
        <i class="ti ti-chevron-right mp-chevron"></i>
      </button>
      <button class="mp-member" data-idx="2">
        <div class="mp-av av2" id="mpAv2">박</div>
        <div class="mp-info"><span class="mp-name" id="mpName2">박지호</span><span class="mp-role">Researcher C</span></div>
        <i class="ti ti-chevron-right mp-chevron"></i>
      </button>
    </div>
    <div id="pwSection" style="display:none">
      <button id="pwBack" class="pw-back"><i class="ti ti-arrow-left"></i> 뒤로</button>
      <div class="pw-row">
        <input type="password" id="pwInput" class="pw-input" placeholder="Password">
        <button id="pwBtn" class="pw-btn">→</button>
      </div>
      <div id="pwErr" class="pw-err"></div>
    </div>
  </div>
</div>

<!-- ===== APP ===== -->
<div id="appPage" class="page" style="display:none">
  <header class="topbar">
    <div class="topbar-left">
      <div class="tb-logo"><img src="logo.png" alt="WB" style="width:26px;height:26px;object-fit:contain;"></div>
      <span class="tb-title">2026 UGRP</span>
    </div>
    <nav class="tb-nav">
      <button class="nav-btn active" data-tab="timer"><i class="ti ti-clock"></i><span>타이머</span></button>
      <button class="nav-btn" data-tab="stats"><i class="ti ti-chart-bar"></i><span>통계</span></button>
      <button class="nav-btn" data-tab="files"><i class="ti ti-calendar"></i><span>자료</span></button>
    </nav>
    <div class="topbar-right">
      <div class="user-chip" id="userChip" style="cursor:pointer">
        <div class="chip-dot"></div>
        <span id="chipName">-</span>
      </div>
      <button id="logoutBtn" class="icon-btn"><i class="ti ti-logout"></i></button>
    </div>
  </header>

  <!-- TIMER -->
  <div class="tab active" id="tab-timer">
    <div class="tab-inner">
      <div class="timer-layout">
        <div class="timer-main">
          <div class="timer-label" id="timerLabel">대기 중</div>
          <div class="timer-clock" id="timerClock">00:00:00</div>
          <div class="timer-btns">
            <button class="btn-start" id="startBtn"><i class="ti ti-player-play-filled"></i> 연구 시작</button>
            <button class="btn-stop" id="stopBtn" style="display:none"><i class="ti ti-player-stop-filled"></i> 연구 종료</button>
          </div>
          <textarea id="timerNote" class="timer-note" placeholder="오늘 연구 내용 메모..." style="display:none"></textarea>
        </div>
        <div class="timer-side">
          <div class="stat-card"><div class="sc-lbl"><i class="ti ti-sun"></i> 오늘</div><div class="sc-val" id="todayTime">0분</div><div class="sc-sub" id="todaySess">세션 0회</div></div>
          <div class="stat-card"><div class="sc-lbl"><i class="ti ti-calendar-week"></i> 이번 주</div><div class="sc-val" id="weekTime">0분</div><div class="sc-sub" id="weekDays">0일 연구</div></div>
          <div class="stat-card"><div class="sc-lbl"><i class="ti ti-infinity"></i> 누적</div><div class="sc-val" id="totalTime">0시간</div><div class="sc-sub" id="totalSess">총 0회</div></div>
        </div>
      </div>
      <div class="log-card">
        <div class="log-title">최근 연구 기록</div>
        <div id="logList" class="log-list"><div class="empty-msg">아직 기록이 없습니다</div></div>
      </div>
    </div>
  </div>

  <!-- STATS -->
  <div class="tab" id="tab-stats">
    <div class="tab-inner">
      <div class="stats-topbar">
        <h2 class="stats-h">팀 연구 현황</h2>
        <div class="period-btns">
          <button class="period-btn active" data-p="week">이번 주</button>
          <button class="period-btn" data-p="month">이번 달</button>
          <button class="period-btn" data-p="all">전체</button>
        </div>
      </div>
      <div id="metricsRow" class="metrics-row"></div>
      <div class="stats-cols">
        <div class="stats-block"><div class="sb-title">연구시간 순위</div><div id="rankList"></div></div>
        <div class="stats-block"><div class="sb-title">일별 팀 기록</div><div id="dailyLog"></div></div>
      </div>
    </div>
  </div>

  <!-- FILES -->
  <div class="tab" id="tab-files">
    <div class="cal-topbar">
      <button class="cal-nav-btn" id="calPrev"><i class="ti ti-chevron-left"></i></button>
      <span class="cal-title" id="calTitle"></span>
      <button class="cal-nav-btn" id="calToday">오늘</button>
      <button class="cal-nav-btn" id="calNext"><i class="ti ti-chevron-right"></i></button>
      <div style="flex:1"></div>
      <button class="fab-add" id="fabAdd"><i class="ti ti-plus"></i> 자료 추가</button>
    </div>
    <div class="cal-scroll"><div class="cal-row" id="calRow"></div></div>
  </div>

  <!-- PROFILE PAGE (탭처럼 전환) -->
  <div class="tab" id="tab-profile">
    <div class="profile-banner" id="profileBanner">
      <button class="profile-back-btn" id="profileBackBtn"><i class="ti ti-arrow-left"></i></button>
      <div class="banner-edit-overlay" id="bannerEditOverlay">
        <i class="ti ti-camera"></i>
        <span>배경 변경</span>
      </div>
      <input type="file" id="bannerFileInput" accept="image/*" style="display:none">
    </div>
    <div class="profile-body">
      <div class="profile-identity">
        <div class="profile-avatar" id="profileAvatar">
        <span id="profileAvatarEmoji">🔬</span>
        <img id="profileAvatarImg" style="display:none">
        <div class="profile-avatar-overlay" id="avatarEditOverlay"><i class="ti ti-camera"></i></div>
        <input type="file" id="avatarFileInput" accept="image/*" style="display:none">
      </div>
        <div>
          <div class="profile-name" id="profileName"></div>
          <div class="profile-role" id="profileRole"></div>
        </div>
      </div>
      <div class="profile-bio-wrap">
      <div class="profile-bio" id="profileBio"></div>
      <button class="bio-edit-btn" id="bioEditBtn" title="소개 편집"><i class="ti ti-pencil"></i></button>
    </div>
    <div class="bio-edit-form" id="bioEditForm" style="display:none">
      <input type="text" id="bioInput" class="bio-input" placeholder="한 줄 소개를 입력하세요...">
      <div class="bio-edit-btns">
        <button class="bio-cancel" id="bioCancelBtn">취소</button>
        <button class="bio-save" id="bioSaveBtn">저장</button>
      </div>
    </div>
      <div class="profile-stats" id="profileStats"></div>
      <div class="profile-recent" id="profileRecent"></div>

      <!-- 아바타 선택 패널 -->
      <div class="avatar-pick-panel" id="avatarPickPanel" style="display:none">
        <div class="app-title">프로필 사진 변경</div>
        <div class="app-section-label">동물</div>
        <div class="emoji-grid" id="animalEmojiGrid"></div>
        <div class="app-section-label" style="margin-top:12px">기타</div>
        <div class="emoji-grid" id="otherEmojiGrid"></div>
        <div class="app-section-label" style="margin-top:12px">사진 업로드</div>
        <button class="pef-upload-btn" id="avatarUploadBtn"><i class="ti ti-upload"></i> 사진 업로드 (JPG, PNG)</button>
        <div class="pef-preview-wrap" id="pefAvatarPreview" style="display:none">
          <img class="pef-preview-img" id="pefAvatarPreviewImg">
          <span style="font-size:13px;color:rgba(255,255,255,.5)">새 프로필 사진</span>
          <button class="pef-preview-clear" id="clearAvatarBtn"><i class="ti ti-x"></i></button>
        </div>
        <div class="app-btns">
          <button class="app-cancel" id="avatarPickCancel">취소</button>
          <button class="app-save" id="avatarPickSave">저장</button>
        </div>
      </div>

      <!-- 배너 선택 패널 -->
      <div class="avatar-pick-panel" id="bannerPickPanel" style="display:none">
        <div class="app-title">배경 변경</div>
        <div class="app-section-label">프리셋</div>
        <div class="banner-presets" id="bannerPresets"></div>
        <div class="app-section-label" style="margin-top:12px">사진 업로드</div>
        <button class="pef-upload-btn" id="bannerUploadBtn"><i class="ti ti-photo"></i> 배경 사진 업로드</button>
        <div class="pef-preview-wrap" id="pefBannerPreview" style="display:none">
          <img class="pef-preview-img" id="pefBannerPreviewImg" style="border-radius:8px;width:80px;height:40px;object-fit:cover;">
          <span style="font-size:13px;color:rgba(255,255,255,.5)">새 배경 사진</span>
          <button class="pef-preview-clear" id="clearBannerBtn"><i class="ti ti-x"></i></button>
        </div>
        <div class="app-btns">
          <button class="app-cancel" id="bannerPickCancel">취소</button>
          <button class="app-save" id="bannerPickSave">저장</button>
        </div>
      </div>

      <!-- 편집 폼 -->
      <div class="profile-edit-form" id="profileEditForm" style="display:none">
        <div class="pef-section-title">프로필 편집</div>
        <div class="pef-row"><div class="pef-label">이름</div><input type="text" class="pef-input" id="pefName"></div>
        <div class="pef-row"><div class="pef-label">소개</div><input type="text" class="pef-input" id="pefBio" placeholder="한 줄 소개"></div>
        <div class="pef-row"><div class="pef-label">비밀번호</div><input type="password" class="pef-input" id="pefPw" placeholder="변경할 비밀번호 (비워두면 유지)"></div>
        <div class="pef-btns">
          <button class="pef-cancel" id="pefCancel">취소</button>
          <button class="pef-save" id="pefSave">저장</button>
        </div>
        <div class="pef-msg" id="pefMsg"></div>
      </div>
    </div>
  </div>
</div>

<!-- ADD MODAL -->
<div class="overlay" id="addModal" style="display:none" onclick="if(event.target===this)this.style.display='none'">
  <div class="modal-box" onclick="event.stopPropagation()">
    <div class="modal-head">
      <h3 id="addModalTitle">자료 추가</h3>
      <button class="modal-x" id="addClose"><i class="ti ti-x"></i></button>
    </div>
    <div class="ff"><label>URL <span class="req">*</span></label><input type="url" id="fUrl" placeholder="https://drive.google.com/..."></div>
    <div class="ff"><label>제목 <span class="req">*</span></label><input type="text" id="fTitle" placeholder="자료 제목"></div>
    <div class="ff"><label>종류</label>
      <select id="fType">
        <option value="gdrive">구글 드라이브</option>
        <option value="gdoc">구글 Docs</option>
        <option value="gsheet">구글 Sheets</option>
        <option value="gslide">구글 Slides</option>
        <option value="notion">노션</option>
        <option value="paper">논문 / PDF</option>
        <option value="github">GitHub</option>
        <option value="etc">기타</option>
      </select>
    </div>
    <div class="ff"><label>메모</label><textarea id="fNote" placeholder="간단한 설명..."></textarea></div>
    <div class="modal-foot">
      <button class="btn-cancel" id="addCancel">취소</button>
      <button class="btn-primary" id="addSave">추가</button>
    </div>
  </div>
</div>

<!-- VIEWER MODAL -->
<div class="overlay" id="viewerModal" style="display:none" onclick="if(event.target===this)this.style.display='none'">
  <div class="viewer-box" onclick="event.stopPropagation()">
    <div class="viewer-head">
      <div class="vh-left">
        <div class="vtype-icon" id="vTypeIcon"></div>
        <div><div class="v-title" id="vTitle"></div><div class="v-meta" id="vMeta"></div></div>
      </div>
      <div class="vh-actions">
        <a id="vOpenLink" href="#" target="_blank" rel="noopener" class="v-btn"><i class="ti ti-external-link"></i> 원본</a>
        <button id="vDeleteBtn" class="v-btn danger"><i class="ti ti-trash"></i> 삭제</button>
        <button id="viewerClose" class="v-btn"><i class="ti ti-x"></i></button>
      </div>
    </div>
    <div class="viewer-body">
      <div class="viewer-pane" id="viewerPane"></div>
      <div class="comments-side">
        <div class="cs-title"><i class="ti ti-messages"></i> 코멘트</div>
        <div class="cs-list" id="commentsList"></div>
        <div class="cs-input">
          <textarea id="commentInput" placeholder="코멘트 작성..."></textarea>
          <button id="commentSend"><i class="ti ti-send"></i></button>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
<script type="module" src="app.js"></script>

</body>
</html>
